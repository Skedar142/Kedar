-- themes/dark.conf
-- Nothing Phone Dark Theme overlay
-- Appended to .conkyrc by install.sh when dark theme is selected

-- This file intentionally left as a comment-only overlay;
-- the base .conkyrc already uses the dark monochromatic palette.
-- Override individual color keys here if you want to customise further.

--[[
  Dark theme reference palette (Nothing Phone aesthetic):
    Background  : #000000  (RGB   0,   0,   0) — pure black
    Card        : #141414  (RGB  20,  20,  20) — subtle card bg
    Primary     : #F5F5F5  (RGB 245, 245, 245) — near-white text
    Secondary   : #888888  (RGB 136, 136, 136) — mid-gray labels
    Dim         : #333333  (RGB  51,  51,  51) — dim / inactive
    Accent      : #E0E0E0  (RGB 224, 224, 224) — glyph ring fill
    Bar fill    : #E0E0E0
    Bar bg      : #222222

  Glyph ring dot colors:
    Active dot  : #F2F2F2  (bright white)
    Inactive dot: #1E1E1E  (near-black)
    Major tick  : #B2B2B2  (medium gray)
]]
