-- themes/dark.conf
-- Nothing Phone Dark Theme overlay
-- Appended to .conkyrc by install.sh when dark theme is selected

-- This file intentionally left as a comment-only overlay;
-- the base .conkyrc already uses the dark monochromatic palette.
-- Override individual color keys here if you want to customise further.

--[[
  Dark theme reference palette:
    Background  : #0a0a0a  (RGB 10, 10, 10)
    Card        : #1a1a1a  (RGB 26, 26, 26)
    Primary     : #EEEEEE  (RGB 238, 238, 238)
    Secondary   : #AAAAAA  (RGB 170, 170, 170)
    Dim         : #555555  (RGB 85, 85, 85)
    Accent      : #CCCCCC  (RGB 204, 204, 204)
    Bar fill    : #CCCCCC
    Bar bg      : #333333
]]
