-- themes/dark.conf
-- Nothing Phone Dark Theme overlay
-- Appended to .conkyrc by install.sh when dark theme is selected

-- This file intentionally left as a comment-only overlay;
-- the base .conkyrc already uses the dark purple/violet palette.
-- Override individual color keys here if you want to customise further.

--[[
  Dark theme reference palette (purple/violet — designed for dark wallpapers):
    Background  : #0a0614  (RGB  10,  6, 20)  — very dark purple-black
    Card        : #1c1430  (RGB  28, 20, 48)  — dark purple card
    Primary     : #F8F4FF  (RGB 248,244,255)  — near-white lavender
    Secondary   : #AD93D4  (RGB 173,147,212)  — medium lavender
    Dim         : #5E4580  (RGB  94, 69,128)  — muted purple
    Accent      : #9D4EDD  (RGB 157, 78,221)  — vibrant violet
    Bar fill    : #8C2EE6  (RGB 140, 46,230)  — electric purple
    Bar bg      : #28164A  (RGB  40, 22, 74)  — deep purple
]]
