-- themes/light.conf
-- Nothing Phone Light Theme overlay
-- Appended to .conkyrc by install.sh when light theme is selected

-- The snippet below overrides Conky color variables for the light theme.
-- Because Lua config tables cannot be re-opened after the initial
-- conky.config = { … } block, the install script patches colors via
-- sed before conky.config is parsed.  The canonical light-theme values
-- are documented here for reference, and the LUA COLOR table is updated
-- by the install script automatically.

--[[
  Light theme reference palette:
    Background  : #F5F5F5  (RGB 245, 245, 245)
    Card        : #EBEBEB  (RGB 235, 235, 235)
    Primary     : #111111  (RGB  17,  17,  17)
    Secondary   : #666666  (RGB 102, 102, 102)
    Dim         : #BBBBBB  (RGB 187, 187, 187)
    Accent      : #222222  (RGB  34,  34,  34)
    Bar fill    : #333333
    Bar bg      : #CCCCCC

  Glyph ring dot colors (light):
    Active dot  : #111111  (near-black)
    Inactive dot: #D0D0D0  (light gray)
    Major tick  : #555555  (medium gray)

  Note — on the light theme the fill is intentionally darker than the
  background so the filled portion stands out against the light card:
    Bar fill    : #333333  (dark gray — visible progress)
    Bar bg      : #CCCCCC  (light gray — empty track)

  Conky config keys to patch for light theme:
    own_window_colour    = 'F5F5F5'
    own_window_argb_value = 230
    default_color        = '111111'
    color0               = '111111'   -- primary text
    color1               = '666666'   -- secondary text
    color2               = 'BBBBBB'   -- dim / separators
    color3               = '333333'   -- accent / bar fill
    color4               = 'CCCCCC'   -- bar background
]]
