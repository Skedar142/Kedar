-- themes/light.conf
-- Nothing Phone Light Theme overlay
-- Appended to .conkyrc by install.sh when light theme is selected

-- The snippet below overrides Conky color variables for the light theme.
-- Because Lua config tables cannot be re-opened after the initial
-- conky.config = { … } block, the install script patches colors via
-- sed before conky.config is parsed.  The canonical light-theme values
-- are documented here for reference, and the LUA COLOR table is updated
-- by the install script automatically.

--[[
  Light theme reference palette:
    Background  : #F0EAF8  (RGB 240, 234, 248)  — light lavender
    Card        : #E5DCF0  (RGB 229, 220, 240)  — soft lavender card
    Primary     : #1A0A30  (RGB  26,  10,  48)  — deep purple text
    Secondary   : #5E3A88  (RGB  94,  58, 136)  — medium purple text
    Dim         : #9B80C0  (RGB 155, 128, 192)  — muted lavender
    Accent      : #7B2FBE  (RGB 123,  47, 190)  — vivid purple accent
    Bar fill    : #7B2FBE  (RGB 123,  47, 190)  — vivid purple
    Bar bg      : #CDB8E8  (RGB 205, 184, 232)  — pale lavender bar bg

  Conky config keys to patch for light theme:
    own_window_colour    = 'F0EAF8'
    default_color        = '1A0A30'
    color0               = '1A0A30'   -- primary text
    color1               = '5E3A88'   -- secondary text
    color2               = '9B80C0'   -- dim / separators
    color3               = '7B2FBE'   -- accent / bar fill
    color4               = 'CDB8E8'   -- bar background
]]
